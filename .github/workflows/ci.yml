name: Clojure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Unit tests
        run: clojure -M:test
      - name: Build uberjar
        run: clojure -T:build uber
      - name: Verify uberjar exists
        run: test -s target/keystone-clj.jar
